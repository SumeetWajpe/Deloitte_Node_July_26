<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <script src="script.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
    />
  </head>
  <body class="container">
    <nav
      class="navbar navbar-expand-lg bg-dark border-bottom border-body"
      data-bs-theme="dark"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Online Training App</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="NewCourse.html">New Course</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="Login.html"
                >Login</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="row justify-content-center">
      <div class="col-md-5 mt-5">
        <h1 class="mb-4">Login</h1>

        <form id="loginForm" onsubmit="Login(event)">
          <div class="mb-3">
            <label for="txtEmail" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="txtEmail"
              required
            />
          </div>
          <div class="mb-3">
            <label for="txtPassword" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="txtPassword"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <hr />

        <p>Don't have an account?</p>
        <form id="registerForm" onsubmit="Register(event)">
          <div class="mb-3">
            <label for="txtName" class="form-label">Name</label>
            <input type="text" class="form-control" id="txtName" required />
          </div>
          <div class="mb-3">
            <label for="txtRegEmail" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="txtRegEmail"
              required
            />
          </div>
          <div class="mb-3">
            <label for="txtRegPassword" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="txtRegPassword"
              required
            />
          </div>
          <button type="submit" class="btn btn-outline-primary">
            Register
          </button>
        </form>
      </div>
    </main>
  </body>
</html>
